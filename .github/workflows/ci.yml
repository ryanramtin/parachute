name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: |
          bash -n scripts/parachute.sh
          bash -n install.sh
          bash -n test/run.sh
      - name: tests
        run: bash test/run.sh
